name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ─── Frontend: Lint ──────────────────────────────────────────────────────────
  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  # ─── Backend: Syntax + Import Check ─────────────────────────────────────────
  check-backend:
    name: Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-linux.txt

      - name: Install Linux-compatible dependencies
        run: pip install -r backend/requirements-linux.txt

      - name: Syntax-check all Python files
        run: |
          python -m py_compile backend/alerts.py
          python -m py_compile backend/core.py
          python -m py_compile backend/database.py
          python -m py_compile backend/forwarder.py
          python -m py_compile backend/hardware.py
          python -m py_compile backend/mcp_server.py
          python -m py_compile backend/orchestrator.py
          python -m py_compile backend/performance.py
          python -m py_compile backend/project_scanner.py
          python -m py_compile backend/report_generator.py
          python -m py_compile backend/server.py
          python -m py_compile backend/startup_manager.py
          echo "All Python files passed syntax check."

  # ─── Frontend: Build ─────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
